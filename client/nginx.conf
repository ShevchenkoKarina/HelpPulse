server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Запити до API передаємо бекенду (сервіс "server" з docker-compose)
  location /api/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Усі інші адреси віддають index.html: маршрути React (/admin, /track/5 ...) працюють при оновленні сторінки
  location / {
    try_files $uri /index.html;
  }
}
