# HelpPulse: запуск усього проєкту однією командою:  docker compose up --build
# Налаштування беруться з файлу .env (шаблон: .env.example).

services:
  # База даних PostgreSQL. SQL-файли з server/db виконуються автоматично
  # при першому створенні тому (за алфавітом: 01_schema, 02_seed, 03_views).
  db:
    image: postgres:15-alpine
    container_name: helppulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - ./server/db:/docker-entrypoint-initdb.d:ro
      - helppulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Бекенд (Node.js + Express). До бази звертається за іменем сервісу "db".
  server:
    build: ./server
    container_name: helppulse_server
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      CLIENT_ORIGIN: http://localhost:5173
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-1234}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # Фронтенд (React + Vite) з'являється на кроці 4
  # client:
  #   build: ./client
  #   ...

volumes:
  helppulse_pgdata:
